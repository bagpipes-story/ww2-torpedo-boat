# 任意: GitHub の Issue / PR コメントで @claude と書くと Claude Code が動く。
# 使うときは このファイルを .github/workflows/claude.yml に移し、
# リポジトリの Secrets に CLAUDE_CODE_OAUTH_TOKEN（PCで `claude setup-token` を実行して取得）を登録する。
# 通常のiPhone運用はクラウドセッションで足りるので、無理に有効化しなくてよい。
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 30"
