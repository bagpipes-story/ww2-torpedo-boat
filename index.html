<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: ノッチ下まで描く。user-scalable=no: ピンチズームを止める（CLAUDE.md §7 iOS固有） -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Night Hunters (WWII魚雷艇)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b1020; /* docs/02 §7 夜の海 */
        overflow: hidden;
        /* iOS: 引っ張り更新・ダブルタップズーム・長押し選択を止める */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100vw;
        /* 100vh は iOS Safari のツールバー分ずれるので 100dvh（CLAUDE.md §7） */
        height: 100vh;
        height: 100dvh;
      }
      #game canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
